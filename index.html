    <!--
      The font stylesheet used to block the first paint for about half a
      second: nothing at all was drawn until Google answered. It is fetched at
      the same priority as before, but applied once it arrives instead of being
      waited on - the sheet already carries display=swap, so a late font was
      always going to swap in; this just stops the wait happening on a blank
      page. The noscript copy keeps it working without JavaScript.
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
    </noscript>

    <!-- above the fold on every visit: the hand and the object it holds -->
    <link rel="preload" as="image" href="/assets/herobanner/01_robotic_hand.webp" type="image/webp" />
    <link rel="preload" as="image" href="/assets/herobanner/18_core_cube.webp" type="image/webp" />
